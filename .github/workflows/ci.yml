# CI de TeamForMe: compila, prueba y valida todo el monorepo sin tocar Azure.
# Corre en cada pull request y en cada push a ramas distintas de main. El workflow de
# despliegue (deploy.yml) lo reutiliza como primera etapa (workflow_call).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Solo se cancelan ejecuciones viejas de un PR. Cuando deploy.yml llama a este workflow,
  # github.event_name es el del llamador (push) y no conviene cortar un despliegue a medias.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · .NET 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore TeamForMe.Microservices.slnx

      - name: Compilar
        run: dotnet build TeamForMe.Microservices.slnx -c Release --no-restore

      - name: Pruebas
        run: >
          dotnet test TeamForMe.Microservices.slnx -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --results-directory ${{ github.workspace }}/test-results/backend

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend
          if-no-files-found: ignore

  frontend:
    name: Frontend · Angular 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TeamForMeFrontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TeamForMeFrontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (Vitest)
        run: npx ng test --watch=false

      - name: Build de producción (SSR)
        run: npm run build

  infra:
    name: Infraestructura · Bicep y Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar Bicep
        env:
          TFM_INTERNAL_API_KEY: ci-placeholder
          TFM_GRAFANA_PASSWORD: ci-placeholder
        run: |
          az bicep install
          az bicep build -f infra/main.bicep --stdout > /dev/null
          az bicep build-params -f infra/main.bicepparam --stdout > /dev/null
          echo "Bicep OK"

      - name: Renderizar manifiestos Kustomize
        run: |
          kubectl kustomize k8s/ms-events/overlays/local > /dev/null
          kubectl kustomize k8s/ms-events/overlays/aks > /dev/null
          echo "Kustomize OK"

  images:
    name: Imagen · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ms-events,        context: microservices,            args: "SERVICE=MS.Events" }
          - { name: ms-teams,         context: microservices,            args: "SERVICE=MS.Teams" }
          - { name: ms-applications,  context: microservices,            args: "SERVICE=MS.Applications" }
          - { name: ms-users,         context: microservices,            args: "SERVICE=MS.Users" }
          - { name: ms-notifications, context: microservices,            args: "SERVICE=MS.Notifications" }
          - { name: gateway,          context: gateway,                  args: "" }
          - { name: frontend,         context: TeamForMeFrontend,        args: "" }
          - { name: prometheus,       context: observability/prometheus, args: "" }
          - { name: grafana,          context: observability/grafana,    args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo verifica que la imagen se construye; no publica nada.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
