# Despliegue continuo del frontend en la Container App que ya existe en Azure.
#
#   CI  →  build + push al registro que usa la app  →  az containerapp update  →  verificación
#
# No crea infraestructura. La app destino es la variable FRONTEND_APP (por defecto
# "teamforme-frontend"); el registro y el repositorio de imagen se toman de la imagen que la
# app usa hoy. Autenticación OIDC: variables AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID (ver el repositorio TeamForMeBackend, cloud/scripts/github/setup-oidc.ps1).
#
# Rollback: az containerapp update -n <app> -g <rg> --image <registro>/teamforme/frontend:<tag-anterior>
name: Deploy · frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-teamforme' }}
  APP: ${{ vars.FRONTEND_APP || 'teamforme-frontend' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en Azure
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuración de Azure en GitHub
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for pair in "AZURE_CLIENT_ID:$CLIENT_ID" "AZURE_TENANT_ID:$TENANT_ID" "AZURE_SUBSCRIPTION_ID:$SUBSCRIPTION_ID"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Falta $name. Créalo en Settings → Secrets and variables → Actions → Variables."
              missing=1
            else
              echo "$name: definido"
            fi
          done
          exit $missing

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Leer la imagen actual de la app
        id: target
        run: |
          current=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv | tr -d '\r')
          [ -n "$current" ] || { echo "::error::No existe la Container App $APP en $RESOURCE_GROUP"; exit 1; }
          registry="${current%%/*}"
          repository="${current#*/}"; repository="${repository%%:*}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "App: $APP · imagen actual: $current"

      - name: Login en el registro
        env:
          REGISTRY: ${{ steps.target.outputs.registry }}
        run: az acr login -n "${REGISTRY%%.*}"

      - uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ steps.target.outputs.tag }}
            ${{ steps.target.outputs.image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Actualizar la Container App
        env:
          NEW_IMAGE: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.tag }}
        run: |
          az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --image "$NEW_IMAGE" -o none
          # Se consulta el estado de la propia revisión: algunas apps no informan
          # latestReadyRevisionName (queda vacío aunque la revisión esté sana).
          ok=false
          for i in $(seq 1 30); do
            latest=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv | tr -d '\r')
            read -r prov health <<<"$(az containerapp revision show -n "$APP" -g "$RESOURCE_GROUP" --revision "$latest" \
              --query "[properties.provisioningState, properties.healthState]" -o tsv | tr -d '\r' | tr '\n' ' ')"
            echo "intento $i: revisión=$latest aprovisionamiento=$prov salud=$health"
            if [ "$prov" = "Provisioned" ] && [ "$health" != "Unhealthy" ]; then ok=true; break; fi
            [ "$prov" = "Failed" ] && break
            sleep 10
          done
          [ "$ok" = true ] || { echo "::error::La revisión $latest no quedó lista (aprovisionamiento=$prov, salud=$health)"; exit 1; }
          echo "REVISION=$latest" >> "$GITHUB_ENV"
          echo "FQDN=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Verificar respuesta HTTP
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$FQDN/" || true)
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::https://$FQDN no respondió 200"; exit 1

      - name: Resumen
        if: always()
        env:
          BEFORE: ${{ steps.target.outputs.current }}
          NEW_IMAGE: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.tag }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Frontend · $APP"
            echo "| | |"
            echo "|---|---|"
            echo "| Resultado | $STATUS |"
            echo "| Imagen anterior | \`$BEFORE\` |"
            echo "| Imagen nueva | \`$NEW_IMAGE\` |"
            echo "| Revisión | \`${REVISION:-—}\` |"
            echo "| URL | https://${FQDN:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"
